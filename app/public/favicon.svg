<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="blobGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87" />
      <stop offset="100%" stop-color="#60EFFF" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00E676" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Outer Dark Ring -->
  <circle cx="32" cy="32" r="30" fill="#0B0F19" stroke="#00E676" stroke-width="2.5" />

  <!-- Organic Agar Blob Cell -->
  <path d="M32 7 C45 7, 56 18, 56 32 C56 46, 45 57, 32 57 C19 57, 8 46, 8 32 C8 18, 19 7, 32 7 Z" 
        fill="url(#blobGrad)" filter="url(#glow)"/>

  <!-- Glossy 3D Highlight -->
  <ellipse cx="23" cy="20" rx="9" ry="5" transform="rotate(-30 23 20)" fill="white" opacity="0.45" />

  <!-- Center Solana Emblem with Rollup Lightning Bolt -->
  <!-- Solana Bar 1 -->
  <path d="M21 23 L41 23 L43 26 L23 26 Z" fill="#0B0F19" />
  <!-- Solana Bar 2 -->
  <path d="M23 30 L43 30 L41 33 L21 33 Z" fill="#0B0F19" />
  <!-- Solana Bar 3 -->
  <path d="M21 37 L41 37 L43 40 L23 40 Z" fill="#0B0F19" />

  <!-- Ephemeral Rollup Lightning Badge (Bottom-Right) -->
  <circle cx="47" cy="47" r="11" fill="#0B0F19" stroke="#FFE600" stroke-width="2" />
  <path d="M47 39 L42 47 L46 47 L44 54 L51 45 L47 45 Z" fill="url(#boltGrad)" />
</svg>